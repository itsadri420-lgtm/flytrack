<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FlyTrack 3D</title>
<style>
:root{--bg:#0b0f17;--card:#141a26;--ac:#f07a28;--tx:#e8edf5;--mu:#8b97ab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;height:54px;flex:none}
#title{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--card);color:var(--tx);border:1px solid #2a3446;border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit}
.btn.on{background:#b3261e;border-color:#b3261e}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;top:0;left:0;right:0;bottom:0;background:#0b0f17}
#hud{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,24,32,.8);border-radius:16px;padding:8px 4px;z-index:5;text-align:center}
.hc{padding:2px 0;border-radius:10px;margin:0 2px}
.hc b{display:block;font:600 19px ui-monospace,Menlo,monospace}
.hc i{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;color:var(--mu);margin-top:2px}
#msg{position:absolute;left:50%;transform:translateX(-50%);top:84px;max-width:92%;background:rgba(20,24,32,.88);padding:8px 14px;border-radius:12px;z-index:6;font-size:13px;display:none;text-align:center}
#mapbtns{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.fab{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;font-family:inherit}
.fab.sec{background:rgba(20,26,38,.88);border:1px solid #2a3446}
#ctl{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none}
#bPlay{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:18px}
#seek{flex:1;min-width:0;accent-color:var(--ac)}
#tl{font:13px ui-monospace,Menlo,monospace;color:var(--mu);white-space:nowrap}
#chart{flex:none;height:190px;padding:0 10px 8px}
#legend{display:flex;justify-content:center;gap:18px;padding:4px 0 6px}
#legend span{font-size:13px;color:var(--tx);opacity:.45}
#legend span.on{opacity:1}
#legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
#cwrap{position:relative;height:138px}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
#cur{position:absolute;top:0;bottom:0;width:2px;background:#e9967a;left:0;pointer-events:none}
.pilot{width:22px;height:22px;border-radius:50%;background:#3556b8;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.maplibregl-ctrl-attrib{font-size:10px!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title">FlyTrack 3D</div>
    <button class="btn" id="bOpen">Datei</button>
    <button class="btn" id="bRec">● Aufnahme</button>
  </header>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="hud">
      <div class="hc"><b id="hAlt">–</b><i>HÖHE</i></div>
      <div class="hc" id="hVc"><b id="hVar">–</b><i>VARIO</i></div>
      <div class="hc"><b id="hSpd">–</b><i>KM/H</i></div>
      <div class="hc"><b id="hTime">–</b><i>ZEIT</i></div>
      <div class="hc"><b id="hDist">–</b><i>KM</i></div>
    </div>
    <div id="msg"></div>
    <div id="mapbtns">
      <button class="fab sec" id="bDist">Abstand 600 m</button>
      <button class="fab sec" id="bEx">Relief ×1.4</button>
      <button class="fab" id="bFollow">Frei</button>
    </div>
  </div>
  <div id="ctl">
    <button id="bPlay">▶</button>
    <button class="btn" id="bSpd">1×</button>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span id="tl">00:00 / 00:00</span>
  </div>
  <div id="chart">
    <div id="legend">
      <span id="lgA" class="on" style="--c:#7fb4ff">Höhe</span>
      <span id="lgS" class="on" style="--c:#4ade80">Speed</span>
      <span id="lgV" class="on" style="--c:#fb923c">Vario</span>
    </div>
    <div id="cwrap"><canvas id="cv"></canvas><div id="cur"></div></div>
  </div>
</div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var msgTimer=null;
function msg(s,ms){
  var m=$('msg'); if(!s){m.style.display='none';return;}
  m.textContent=s; m.style.display='block';
  clearTimeout(msgTimer); if(ms){msgTimer=setTimeout(function(){m.style.display='none';},ms);}
}
window.onerror=function(e){msg('Fehler: '+e,6000);};

/* ---------- Kartenstil ---------- */
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
var AWS='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
var EMPTY={type:'FeatureCollection',features:[]};
var NM=['coalesce',['get','name_de'],['get','name']];
function lblPlace(id,classes,minz,size){
  return {id:id,type:'symbol',source:'omt','source-layer':'place',minzoom:minz,
    filter:['in','class'].concat(classes),
    layout:{'text-field':NM,'text-font':['Noto Sans Regular'],'text-size':size,'text-max-width':8},
    paint:{'text-color':'#ffffff','text-halo-color':'rgba(0,0,0,0.85)','text-halo-width':1.6}};
}
var STYLE={
  version:8,
  glyphs:'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
  sources:{
    sat:{type:'raster',tiles:[ESRI],tileSize:256,maxzoom:19,attribution:'Bilder © Esri, Maxar, Earthstar Geographics'},
    dem:{type:'raster-dem',tiles:[AWS],tileSize:256,maxzoom:15,encoding:'terrarium'},
    omt:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'© OpenFreeMap © OpenStreetMap'},
    full:{type:'geojson',data:EMPTY},
    seg:{type:'geojson',data:EMPTY}
  },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':'#0b0f17'}},
    {id:'sat',type:'raster',source:'sat'},
    {id:'ghost',type:'line',source:'full',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-opacity':0.5,'line-width':2.5}},
    {id:'seg',type:'line',source:'seg',filter:['<=',['get','i'],-1],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['get','c'],'line-width':5}},
    lblPlace('pl1',['city','town'],4,['interpolate',['linear'],['zoom'],5,12,12,18]),
    lblPlace('pl2',['village'],9,['interpolate',['linear'],['zoom'],9,12,14,16]),
    lblPlace('pl3',['hamlet','suburb','neighbourhood'],11.5,['interpolate',['linear'],['zoom'],11,11,15,14]),
    {id:'pk',type:'symbol',source:'omt','source-layer':'mountain_peak',minzoom:10.5,filter:['has','name'],
      layout:{'text-field':['case',['has','ele'],['concat',NM,' · ',['to-string',['get','ele']],' m'],NM],'text-font':['Noto Sans Regular'],'text-size':12,'text-anchor':'top','text-offset':[0,0.3],'text-max-width':9},
      paint:{'text-color':'#ffe9a8','text-halo-color':'rgba(0,0,0,0.85)','text-halo-width':1.5}},
    {id:'ad',type:'symbol',source:'omt','source-layer':'aerodrome_label',minzoom:9,filter:['has','name'],
      layout:{'text-field':NM,'text-font':['Noto Sans Regular'],'text-size':12,'text-max-width':9},
      paint:{'text-color':'#9be7ff','text-halo-color':'rgba(0,0,0,0.85)','text-halo-width':1.5}}
  ]
};

/* ---------- Zustand ---------- */
var map=null,ready=false,pending=null,marker=null;
var SPEEDS=[1,2,5,10,20,60],spi=0,EX=[1,1.4,2,3],ei=1;
var n=0,T=null,LA=null,LO=null,AL=null,SP=null,VA=null,CUM=null,HD=null,total=0,SEGIDX=null;
var t=0,playing=false,follow=false,bear=0,userSeek=false,lastIdx=0;
var liveOn=false,LP=[],liveDist=0,liveMax=0;
var show={a:true,s:true,v:true};
var ORG=[0,0],FD=[[250,90],[600,200],[1500,500],[4000,1500]],fdi=1;
var G3={on:false,tried:false,k:-1,lastI:0,R:0,P3:null,cols:null,RAD:6};

/* ---------- Parser ---------- */
function parseIgc(s){
  var L=[],off=0,prev=-1,lines=s.split(/\r?\n/);
  for(var k=0;k<lines.length;k++){
    var ln=lines[k];
    if(ln.length<35||ln.charAt(0)!=='B')continue;
    var f=function(a,b){return parseInt(ln.substring(a,b),10);};
    var tt=f(1,3)*3600+f(3,5)*60+f(5,7)+off;
    if(prev>=0&&tt<prev){off+=86400;tt+=86400;}
    var la=f(7,9)+f(9,14)/60000; if(ln.charAt(14)==='S')la=-la;
    var lo=f(15,18)+f(18,23)/60000; if(ln.charAt(23)==='W')lo=-lo;
    var press=f(25,30),gps=f(30,35);
    var alt=(gps&&gps!==0)?gps:press;
    if(isNaN(tt)||isNaN(la)||isNaN(lo)||isNaN(alt))continue;
    prev=tt; L.push([tt,la,lo,alt]);
  }
  return L;
}
function parseGpx(s){
  var L=[],re=/<trkpt\s([^>]*)>([\s\S]*?)<\/trkpt>/g,m;
  while((m=re.exec(s))){
    var la=/lat="([^"]+)"/.exec(m[1]),lo=/lon="([^"]+)"/.exec(m[1]);
    if(!la||!lo)continue;
    var e=/<ele>([^<]+)<\/ele>/.exec(m[2]),tm=/<time>([^<]+)<\/time>/.exec(m[2]);
    var tt=tm?Date.parse(tm[1])/1000:L.length;
    if(isNaN(tt))tt=L.length;
    L.push([tt,parseFloat(la[1]),parseFloat(lo[1]),e?parseFloat(e[1]):0]);
  }
  return L;
}
function titleOf(s){
  var m=/HFDTE(\d\d)(\d\d)(\d\d)/.exec(s);
  if(m)return 'Flug '+m[1]+'.'+m[2]+'.20'+m[3];
  var g=/<time>(\d{4})-(\d\d)-(\d\d)/.exec(s);
  if(g)return 'Flug '+g[3]+'.'+g[2]+'.'+g[1];
  return 'Flug';
}
function build(pts){
  if(pts.length<2)return null;
  var stride=Math.max(1,Math.ceil(pts.length/6000)),P=[],i;
  for(i=0;i<pts.length;i+=stride){var p=pts[i];if(P.length&&p[0]<=P[P.length-1][0])continue;P.push(p);}
  var lp=pts[pts.length-1]; if(P.length&&lp[0]>P[P.length-1][0])P.push(lp);
  var m=P.length; if(m<2)return null;
  var o={n:m,T:new Float64Array(m),LA:new Float64Array(m),LO:new Float64Array(m),AL:new Float32Array(m),
    SP:new Float32Array(m),VA:new Float32Array(m),CUM:new Float32Array(m),HD:new Float32Array(m)};
  var cl=Math.cos(P[0][1]*Math.PI/180),X=new Float64Array(m),Y=new Float64Array(m);
  for(i=0;i<m;i++){
    o.T[i]=P[i][0]-P[0][0];o.LA[i]=P[i][1];o.LO[i]=P[i][2];o.AL[i]=P[i][3];
    X[i]=(P[i][2]-P[0][2])*111320*cl;Y[i]=(P[i][1]-P[0][1])*110540;
  }
  var d=0,lastH=0;
  for(i=0;i<m;i++){
    var a=Math.max(0,i-3),b=Math.min(m-1,i+3),dt=o.T[b]-o.T[a];
    if(dt>0)o.SP[i]=Math.hypot(X[b]-X[a],Y[b]-Y[a])/dt*3.6;
    a=Math.max(0,i-4);b=Math.min(m-1,i+4);dt=o.T[b]-o.T[a];
    if(dt>0)o.VA[i]=(o.AL[b]-o.AL[a])/dt;
    if(i>0)d+=Math.hypot(X[i]-X[i-1],Y[i]-Y[i-1]);
    o.CUM[i]=d/1000;
    a=Math.max(0,i-5);b=Math.min(m-1,i+5);
    var dx=X[b]-X[a],dy=Y[b]-Y[a];
    if(Math.hypot(dx,dy)>2)lastH=Math.atan2(dx,dy)*180/Math.PI;
    o.HD[i]=lastH;
  }
  return o;
}
function vcol(v){
  if(v<-2)return '#3b82f6'; if(v<-0.5)return '#22d3ee'; if(v<0.5)return '#facc15'; if(v<2)return '#fb923c'; return '#ef4444';
}


/* ---------- 3D-Spur in echter Höhe ---------- */
function tubeData(P3,cols,m,R,RAD){
  var pos=new Float32Array(m*RAD*3),col=new Float32Array(m*RAD*3),idx=[],k,j;
  for(k=0;k<m;k++){
    var a=Math.max(0,k-1),b=Math.min(m-1,k+1);
    var tx=P3[b*3]-P3[a*3],ty=P3[b*3+1]-P3[a*3+1],tz=P3[b*3+2]-P3[a*3+2];
    var tl=Math.hypot(tx,ty,tz)||1;tx/=tl;ty/=tl;tz/=tl;
    var nx=ty,ny=-tx,nl=Math.hypot(nx,ny);
    if(nl<1e-4){nx=1;ny=0;nl=1;}
    nx/=nl;ny/=nl;
    var bx=-tz*ny,by=tz*nx,bz=tx*ny-ty*nx;
    var c=cols[k];
    for(j=0;j<RAD;j++){
      var ang=j/RAD*2*Math.PI,ca=Math.cos(ang)*R,sa=Math.sin(ang)*R,o=(k*RAD+j)*3;
      pos[o]=P3[k*3]+nx*ca+bx*sa;pos[o+1]=P3[k*3+1]+ny*ca+by*sa;pos[o+2]=P3[k*3+2]+bz*sa;
      col[o]=c[0];col[o+1]=c[1];col[o+2]=c[2];
    }
  }
  for(k=0;k<m-1;k++)for(j=0;j<RAD;j++){
    var j2=(j+1)%RAD,a0=k*RAD+j,a1=k*RAD+j2,b0=(k+1)*RAD+j,b1=(k+1)*RAD+j2;
    idx.push(a0,b0,a1,a1,b0,b1);
  }
  return {pos:pos,col:col,idx:idx};
}
function curtainData(P3,cols,m,depth){
  var pos=new Float32Array(m*2*3),col=new Float32Array(m*2*4),idx=[],k;
  for(k=0;k<m;k++){
    pos[k*6]=P3[k*3];pos[k*6+1]=P3[k*3+1];pos[k*6+2]=P3[k*3+2];
    pos[k*6+3]=P3[k*3];pos[k*6+4]=P3[k*3+1];pos[k*6+5]=P3[k*3+2]-depth;
    var c=cols[k];
    col[k*8]=c[0];col[k*8+1]=c[1];col[k*8+2]=c[2];col[k*8+3]=0.5;
    col[k*8+4]=c[0];col[k*8+5]=c[1];col[k*8+6]=c[2];col[k*8+7]=0;
  }
  for(k=0;k<m-1;k++)idx.push(2*k,2*k+1,2*k+2,2*k+1,2*k+3,2*k+2);
  return {pos:pos,col:col,idx:idx};
}
function hex2rgb(s){return [parseInt(s.substr(1,2),16)/255,parseInt(s.substr(3,2),16)/255,parseInt(s.substr(5,2),16)/255];}
function mpp(lat){return 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,map.getZoom());}
function wantR(lat){
  if(follow)return Math.max(3,0.006*Math.hypot(FD[fdi][0],FD[fdi][1]));
  return Math.max(5,2.5*mpp(lat));
}
function mkGeom(d,cs){
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(d.pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(d.col,cs));
  g.setIndex(d.idx);
  return g;
}
function ensureTube(force){
  if(!G3.on||!G3.P3)return;
  var R=wantR(ORG[1]);
  if(!force&&G3.R&&R/G3.R<1.35&&R/G3.R>0.74)return;
  G3.R=R;
  var m=SEGIDX.length,d=tubeData(G3.P3,G3.cols,m,R,G3.RAD);
  var g1=mkGeom(d,3),g2=new THREE.BufferGeometry();
  g2.setAttribute('position',g1.getAttribute('position'));g2.setIndex(g1.getIndex());
  if(G3.flown.geometry)G3.flown.geometry.dispose();
  if(G3.future.geometry)G3.future.geometry.dispose();
  G3.flown.geometry=g1;G3.future.geometry=g2;
  G3.k=-1;set3D(G3.lastI,null);
}
function build3D(){
  if(!G3.on||n<2)return;
  var m=SEGIDX.length,cl=Math.cos(ORG[1]*Math.PI/180),k;
  var P3=new Float32Array(m*3),cols=[];
  for(k=0;k<m;k++){
    var q=SEGIDX[k];
    P3[k*3]=(LO[q]-ORG[0])*111320*cl;P3[k*3+1]=(LA[q]-ORG[1])*110540;P3[k*3+2]=AL[q];
    cols.push(hex2rgb(vcol(VA[q])));
  }
  G3.P3=P3;G3.cols=cols;
  if(G3.curtain.geometry)G3.curtain.geometry.dispose();
  G3.curtain.geometry=mkGeom(curtainData(P3,cols,m,200),4);
  G3.group.scale.z=EX[ei];G3.group.visible=true;G3.pil.visible=true;
  ensureTube(true);
}
function segAt(i){
  var lo=0,hi=SEGIDX.length-1;
  while(lo<hi){var mid=(lo+hi+1)>>1;if(SEGIDX[mid]<=i)lo=mid;else hi=mid-1;}
  return lo;
}
function set3D(i,pos){
  if(!G3.on||!G3.P3)return;
  G3.lastI=i;
  var m=SEGIDX.length,per=G3.RAD*6,k=segAt(i);
  if(k!==G3.k){
    G3.k=k;
    G3.flown.geometry.setDrawRange(0,k*per);
    G3.future.geometry.setDrawRange(k*per,Math.max(0,(m-1-k)*per));
    G3.curtain.geometry.setDrawRange(0,k*6);
  }
  if(pos){
    var cl=Math.cos(ORG[1]*Math.PI/180);
    G3.pil.position.set((pos[0]-ORG[0])*111320*cl,(pos[1]-ORG[1])*110540,pos[2]*EX[ei]);
    var rs=follow?Math.max(5,0.011*Math.hypot(FD[fdi][0],FD[fdi][1])):Math.max(8,10*mpp(pos[1]));
    G3.pil.scale.set(rs,rs,rs);
  }
}
function followCam(lng,lat,alt,brg){
  var D=FD[fdi][0],H=FD[fdi][1],rad=brg*Math.PI/180;
  var dLat=-Math.cos(rad)*D/110540,dLon=-Math.sin(rad)*D/(111320*Math.cos(lat*Math.PI/180));
  var cam=map.getFreeCameraOptions();
  cam.position=maplibregl.MercatorCoordinate.fromLngLat([lng+dLon,lat+dLat],alt*EX[ei]+H);
  cam.setPitchBearing(Math.atan2(D,H)*180/Math.PI,brg);
  map.setFreeCameraOptions(cam);
}
var customLayer={
  id:'trail3d',type:'custom',renderingMode:'3d',
  onAdd:function(m,gl){
    G3.scene=new THREE.Scene();G3.camera=new THREE.Camera();
    G3.renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});
    G3.renderer.autoClear=false;
    var dbl=THREE.DoubleSide;
    G3.future=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.3,side:dbl,depthWrite:false}));
    G3.flown=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({vertexColors:true,side:dbl}));
    G3.curtain=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,side:dbl,depthWrite:false}));
    G3.future.renderOrder=1;G3.curtain.renderOrder=2;G3.flown.renderOrder=3;
    G3.future.frustumCulled=G3.flown.frustumCulled=G3.curtain.frustumCulled=false;
    G3.group=new THREE.Group();G3.group.add(G3.future);G3.group.add(G3.curtain);G3.group.add(G3.flown);
    G3.pil=new THREE.Group();
    var sg=new THREE.SphereGeometry(1,16,12);
    var s1=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0x3556b8}));
    var s2=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.BackSide}));
    s2.scale.set(1.35,1.35,1.35);s1.renderOrder=5;s2.renderOrder=4;
    s1.frustumCulled=false;s2.frustumCulled=false;
    G3.pil.add(s2);G3.pil.add(s1);G3.pil.visible=false;
    G3.scene.add(G3.group);G3.scene.add(G3.pil);
  },
  render:function(gl,matrix){
    var o=ORGM(),s=o.meterInMercatorCoordinateUnits();
    var m=new THREE.Matrix4().fromArray(matrix);
    var l=new THREE.Matrix4().makeTranslation(o.x,o.y,o.z).scale(new THREE.Vector3(s,-s,s));
    G3.camera.projectionMatrix=m.multiply(l);
    if(G3.renderer.resetState)G3.renderer.resetState();else G3.renderer.state.reset();
    G3.renderer.render(G3.scene,G3.camera);
  }
};
function ORGM(){return maplibregl.MercatorCoordinate.fromLngLat([ORG[0],ORG[1]],0);}
function try3D(){
  if(G3.tried||!ready||!window.THREE)return;
  G3.tried=true;
  try{
    map.addLayer(customLayer,'pl1');
    G3.on=true;
    map.setLayoutProperty('seg','visibility','none');
    if(marker)marker.getElement().style.display='none';
    if(n>1){build3D();update();}
  }catch(e){G3.on=false;msg('3D-Spur nicht verfügbar: '+e.message,7000);}
}
function loadThree(urls,k){
  if(k>=urls.length)return;
  var sc=document.createElement('script');sc.src=urls[k];
  sc.onload=function(){try3D();};
  sc.onerror=function(){loadThree(urls,k+1);};
  document.head.appendChild(sc);
}

/* ---------- Track anwenden ---------- */
function applyTrack(o,title){
  liveOn=false;setRecUi(false);
  n=o.n;T=o.T;LA=o.LA;LO=o.LO;AL=o.AL;SP=o.SP;VA=o.VA;CUM=o.CUM;HD=o.HD;total=Math.max(1,T[n-1]);
  var step=Math.max(1,Math.ceil(n/1500)),idxs=[],i;
  for(i=0;i<n;i+=step)idxs.push(i);
  if(idxs[idxs.length-1]!==n-1)idxs.push(n-1);
  SEGIDX=idxs;
  var coords=[],feats=[];
  for(i=0;i<idxs.length;i++){
    var q=idxs[i];coords.push([LO[q],LA[q]]);
    if(i<idxs.length-1){var r=idxs[i+1];
      feats.push({type:'Feature',properties:{c:vcol(VA[q]),i:q},geometry:{type:'LineString',coordinates:[[LO[q],LA[q]],[LO[r],LA[r]]]}});}
  }
  map.getSource('full').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}});
  map.getSource('seg').setData({type:'FeatureCollection',features:feats});
  map.setFilter('seg',['<=',['get','i'],-1]);
  var mnLo=180,mxLo=-180,mnLa=90,mxLa=-90;
  for(i=0;i<n;i++){mnLo=Math.min(mnLo,LO[i]);mxLo=Math.max(mxLo,LO[i]);mnLa=Math.min(mnLa,LA[i]);mxLa=Math.max(mxLa,LA[i]);}
  ORG=[(mnLo+mxLo)/2,(mnLa+mxLa)/2];
  t=0;playing=false;follow=false;lastIdx=0;filtIdx=-2;bear=HD[0];
  $('bPlay').textContent='▶';$('bFollow').textContent='Frei';$('title').textContent=title;
  if(!marker){var el=document.createElement('div');el.className='pilot';marker=new maplibregl.Marker({element:el}).setLngLat([LO[0],LA[0]]).addTo(map);}
  marker.setLngLat([LO[0],LA[0]]);
  if(G3.on){marker.getElement().style.display='none';map.setLayoutProperty('seg','visibility','none');build3D();}
  else marker.getElement().style.display='block';
  map.fitBounds([[mnLo,mnLa],[mxLo,mxLa]],{padding:{top:110,bottom:40,left:30,right:30},pitch:55,bearing:0,maxZoom:15,duration:1200});
  drawChart();update();
  msg(Math.round(T[n-1]/60)+' min · '+CUM[n-1].toFixed(1)+' km geladen',2500);
}
function loadText(s){
  var pts=s.indexOf('<trkpt')>=0?parseGpx(s):parseIgc(s);
  var o=build(pts);
  if(!o){msg('Keine Trackpunkte gefunden (IGC oder GPX erwartet)',5000);return;}
  applyTrack(o,titleOf(s));
}

/* ---------- Wiedergabe ---------- */
function idxAt(x){
  var lo=0,hi=n-1;
  while(lo<hi){var mid=(lo+hi+1)>>1;if(T[mid]<=x)lo=mid;else hi=mid-1;}
  return lo;
}
function fmt(sec){
  sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h>0?h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s:(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function angDiff(a,b){var d=(a-b)%360;if(d>180)d-=360;if(d<-180)d+=360;return d;}
var filtIdx=-2,filtLast=0,filtTimer=null,curIdx=0;
function applyFilt(){
  filtTimer=null;if(!map||n<2)return;
  filtIdx=curIdx;filtLast=Date.now();
  map.setFilter('seg',['<=',['get','i'],curIdx]);
}
function setVarioCell(v){
  var c=$('hVc');
  c.style.background=v<-0.3?'rgba(220,60,60,.4)':(v>0.3?'rgba(50,190,100,.4)':'transparent');
  $('hVar').textContent=(v>0?'+':(v<0?'↓':''))+Math.abs(v).toFixed(1);
}
function update(){
  if(n<2)return;
  var i=idxAt(t),j=Math.min(n-1,i+1),f=T[j]>T[i]?(t-T[i])/(T[j]-T[i]):0;
  var lng=LO[i]+(LO[j]-LO[i])*f,lat=LA[i]+(LA[j]-LA[i])*f,alt=AL[i]+(AL[j]-AL[i])*f;
  lastIdx=i;curIdx=i;
  $('hAlt').textContent=Math.round(alt)+'m';
  setVarioCell(VA[i]);
  $('hSpd').textContent=Math.round(SP[i]);
  $('hTime').textContent=fmt(t);
  $('hDist').textContent=(CUM[i]+(CUM[j]-CUM[i])*f).toFixed(1);
  $('tl').textContent=fmt(t)+' / '+fmt(total);
  if(!userSeek)$('seek').value=Math.round(t/total*1000);
  $('cur').style.left=(t/total*$('cwrap').clientWidth)+'px';
  if(G3.on)set3D(i,[lng,lat,alt]);
  else if(marker)marker.setLngLat([lng,lat]);
  if(i!==filtIdx&&!filtTimer){
    if(Date.now()-filtLast>140)applyFilt();else filtTimer=setTimeout(applyFilt,150);
  }
  if(follow){
    bear+=angDiff(HD[i],bear)*0.08;
    if(G3.on)followCam(lng,lat,alt,bear);else map.jumpTo({center:[lng,lat],bearing:bear});
  }
  if(G3.on)map.triggerRepaint();
}
var lastTs=0;
function frame(ts){
  if(playing&&n>1){
    var dt=lastTs?Math.min(0.1,(ts-lastTs)/1000):0;
    t+=dt*SPEEDS[spi];
    if(t>=total){t=total;playing=false;$('bPlay').textContent='▶';}
    update();
  }
  lastTs=ts;requestAnimationFrame(frame);
}

/* ---------- Diagramm ---------- */
function drawChart(){
  var c=$('cv'),w=c.clientWidth,h=c.clientHeight,r=window.devicePixelRatio||1;
  c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  var g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,w,h);
  if(n<2)return;
  var step=Math.max(1,Math.floor(n/w)),pad=6;
  function series(arr,col,fill,on){
    if(!on)return;
    var mn=1e9,mx=-1e9,i;
    for(i=0;i<n;i++){if(arr[i]<mn)mn=arr[i];if(arr[i]>mx)mx=arr[i];}
    if(mx-mn<1e-6)mx=mn+1;
    g.beginPath();
    for(i=0;i<n;i+=step){
      var x=T[i]/total*w,y=h-pad-(arr[i]-mn)/(mx-mn)*(h-2*pad);
      if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
    }
    g.strokeStyle=col;g.lineWidth=1.5;g.stroke();
    if(fill){g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fillStyle='rgba(127,180,255,0.16)';g.fill();}
  }
  series(AL,'#7fb4ff',true,show.a);
  series(SP,'#4ade80',false,show.s);
  series(VA,'#fb923c',false,show.v);
}

/* ---------- Aufnahme (Live) ---------- */
function setRecUi(on){
  var b=$('bRec');b.textContent=on?'■ Stopp':'● Aufnahme';
  if(on)b.classList.add('on');else b.classList.remove('on');
}
function liveRedraw(){
  var co=[],i;for(i=0;i<LP.length;i++)co.push([LP[i][2],LP[i][1]]);
  map.getSource('full').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:co}});
}

/* ---------- Bedienung ---------- */
function bind(){
  $('bOpen').addEventListener('click',function(){
    if(window.Android)window.Android.openFile();else msg('Nur in der App verfügbar',2500);
  });
  $('bRec').addEventListener('click',function(){
    if(window.Android)window.Android.toggleRec();else msg('Nur in der App verfügbar',2500);
  });
  $('bPlay').addEventListener('click',function(){
    if(n<2)return;
    if(!playing&&t>=total)t=0;
    playing=!playing;$('bPlay').textContent=playing?'❚❚':'▶';
  });
  $('bSpd').addEventListener('click',function(){
    spi=(spi+1)%SPEEDS.length;$('bSpd').textContent=SPEEDS[spi]+'×';
  });
  var sk=$('seek');
  sk.addEventListener('input',function(){userSeek=true;if(n>1){t=total*sk.value/1000;update();}});
  sk.addEventListener('change',function(){userSeek=false;});
  $('bFollow').addEventListener('click',function(){
    if(n<2)return;
    follow=!follow;$('bFollow').textContent=follow?'Folgen':'Frei';
    if(follow){
      bear=HD[lastIdx];
      if(G3.on){ensureTube(true);update();}
      else map.easeTo({center:[LO[lastIdx],LA[lastIdx]],bearing:bear,pitch:68,zoom:14.3,duration:800});
    }else if(G3.on)ensureTube(true);
  });
  $('bEx').addEventListener('click',function(){
    ei=(ei+1)%EX.length;$('bEx').textContent='Relief ×'+EX[ei];
    if(ready)map.setTerrain({source:'dem',exaggeration:EX[ei]});
    if(G3.on&&G3.group){G3.group.scale.z=EX[ei];update();}
  });
  $('bDist').addEventListener('click',function(){
    fdi=(fdi+1)%FD.length;$('bDist').textContent='Abstand '+FD[fdi][0]+' m';
    if(G3.on&&follow){ensureTube(true);update();}
  });
  function tog(id,k){$(id).addEventListener('click',function(){show[k]=!show[k];this.classList.toggle('on',show[k]);drawChart();});}
  tog('lgA','a');tog('lgS','s');tog('lgV','v');
  var cw=$('cwrap');
  function chartSeek(e){
    if(n<2)return;var r=cw.getBoundingClientRect();
    t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*total;update();
  }
  var down=false;
  cw.addEventListener('pointerdown',function(e){down=true;chartSeek(e);});
  cw.addEventListener('pointermove',function(e){if(down)chartSeek(e);});
  window.addEventListener('pointerup',function(){down=false;});
  window.addEventListener('resize',function(){drawChart();});
}

/* ---------- Schnittstelle zur App ---------- */
window.FT={
  loadB64:function(b){
    var s;try{s=atob(b);}catch(e){msg('Datei konnte nicht gelesen werden',4000);return;}
    if(!ready){pending=s;return;}
    loadText(s);
  },
  recState:function(on){
    if(on){
      liveOn=true;LP=[];liveDist=0;liveMax=0;playing=false;n=0;follow=false;
      $('bPlay').textContent='▶';setRecUi(true);$('title').textContent='Aufnahme läuft';
      ['hAlt','hVar','hSpd','hTime','hDist'].forEach(function(k){$(k).textContent='–';});
      if(ready){map.getSource('full').setData(EMPTY);map.getSource('seg').setData(EMPTY);}
      if(marker)marker.getElement().style.display='none';
      if(G3.on&&G3.group){G3.group.visible=false;G3.pil.visible=false;map.triggerRepaint();}
      msg('Warte auf GPS-Signal…');
    }else{liveOn=false;setRecUi(false);}
  },
  live:function(tt,lat,lon,alt,spd){
    if(!liveOn||!ready)return;
    var first=LP.length===0;
    if(!first){var p=LP[LP.length-1];
      liveDist+=Math.hypot((lon-p[2])*111320*Math.cos(lat*Math.PI/180),(lat-p[1])*110540)/1000;}
    LP.push([tt,lat,lon,alt]);liveMax=Math.max(liveMax,alt);
    var vs=0;if(LP.length>6){var o=LP[LP.length-6];vs=(alt-o[3])/Math.max(1,tt-o[0]);}
    $('hAlt').textContent=Math.round(alt)+'m';setVarioCell(vs);
    $('hSpd').textContent=Math.round(spd);
    $('hTime').textContent=fmt(tt-LP[0][0]);$('hDist').textContent=liveDist.toFixed(1);
    if(!marker){var el=document.createElement('div');el.className='pilot';marker=new maplibregl.Marker({element:el}).setLngLat([lon,lat]).addTo(map);}
    marker.getElement().style.display='block';marker.setLngLat([lon,lat]);
    liveRedraw();
    if(first){msg('');map.jumpTo({center:[lon,lat],zoom:14.5,pitch:60});}
    else map.easeTo({center:[lon,lat],duration:900,easing:function(x){return x;}});
  },
  _parse:function(s){return build(s.indexOf('<trkpt')>=0?parseGpx(s):parseIgc(s));}
};

/* ---------- Start ---------- */
function initMap(){
  map=new maplibregl.Map({container:'map',style:STYLE,center:[13.4,47.5],zoom:6.8,pitch:50,maxPitch:80,
    attributionControl:{compact:true},dragRotate:true});
  map.on('error',function(e){var m=e&&e.error&&e.error.message;if(m&&/Failed to fetch|NetworkError|Load failed/i.test(m))msg('Karte lädt nicht – Internet prüfen',3000);});
  map.on('load',function(){
    map.setTerrain({source:'dem',exaggeration:EX[ei]});
    ready=true;
    try3D();
    if(pending){var p=pending;pending=null;loadText(p);}
  });
  map.on('zoomend',function(){if(G3.on&&!follow)ensureTube(false);});
  map.on('dragstart',function(e){if(follow&&e.originalEvent){follow=false;$('bFollow').textContent='Frei';}});
  map.on('rotatestart',function(e){if(follow&&e.originalEvent){follow=false;$('bFollow').textContent='Frei';}});
}
function loadLib(bases,k){
  if(k>=bases.length){msg('Karten-Bibliothek konnte nicht geladen werden – Internet prüfen',8000);return;}
  var sc=document.createElement('script');
  sc.src=bases[k]+'maplibre-gl.js';
  sc.onload=function(){
    var lk=document.createElement('link');lk.rel='stylesheet';lk.href=bases[k]+'maplibre-gl.css';
    document.head.appendChild(lk);
    initMap();
  };
  sc.onerror=function(){loadLib(bases,k+1);};
  document.head.appendChild(sc);
}
if(typeof document!=='undefined'){
  bind();
  requestAnimationFrame(frame);
  loadThree(['https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js','https://unpkg.com/three@0.149.0/build/three.min.js'],0);
  loadLib(['https://unpkg.com/maplibre-gl@4.7.1/dist/','https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/'],0);
}
})();
</script>
